[window]
# dimensions = { columns = 133, lines = 40 }
decorations = "None"
dynamic_title = true
dynamic_padding = true
padding = { x = 0, y = 0 }
opacity = 0.80
blur=true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[terminal.shell]
program = "/bin/zsh"

[env]
TERM = "xterm-256color"

[font]
size = 10.0

[font.bold]
family = "JetbrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetbrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetbrainsMono Nerd Font"
# family = "Hack Nerd Font"
style = "Medium"

[keyboard]
bindings = [
  # { key = "Enter", mods = "Control", action = "ToggleFullscreen" },
  { key = "V", mods = "Control", action = "Paste" },
  # { key = "Right", mods = "Alt", chars = "\u001BF" },
  # { key = "Left", mods = "Alt", chars = "\u001BB" },
  # { key = "D", mods = "Command", chars = "\u0002%" },
  # { key = "D", mods = "Command|Shift", chars = "\u0002\"" },
  # { key = "W", mods = "Command", action = "Quit" },
  # { key = "Down", mods = "Command", chars = "\u0002\u001b[B" },
  # { key = "Up", mods = "Command", chars = "\u0002\u001b[A" },
  # { key = "Left", mods = "Command", chars = "\u0002\u001b[D" },
  # { key = "Right", mods = "Command", chars = "\u0002\u001b[C" },
  # { key = "Enter", mods = "Command|Shift", chars = "\u0002z" },
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
]

[general]
live_config_reload = true
import = ["~/.config/alacritty/ashes/ashes-dark.toml"]

[terminal]
